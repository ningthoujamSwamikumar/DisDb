[package]
name = "dist-db"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
bytes = "1.12.1"
clap = { version = "4.6.2", features = ["derive"] }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
